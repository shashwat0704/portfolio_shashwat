<div 
  class="fixed top-0 left-0 right-0 z-50 flex justify-center pt-2 sm:pt-4 md:pt-6 pb-2 px-3 sm:px-4 transition-all duration-500 ease-in-out pointer-events-none"
  [ngClass]="isVisible || isMenuOpen ? 'translate-y-0 opacity-100' : '-translate-y-full opacity-0'">
  
  <nav class="flex flex-col w-full max-w-4xl bg-brand-nav/95 backdrop-blur-md rounded-2xl border border-white/10 shadow-2xl overflow-hidden transition-all duration-300 pointer-events-auto">
    <div class="flex items-center justify-between w-full px-4 sm:px-6 md:px-8 py-2.5 sm:py-3.5">
      <!-- Mobile Logo / Brand Mark -->
      <a href="#home" class="flex items-center gap-2.5 text-white font-bold tracking-tight">
        <span class="w-8 h-8 rounded-xl bg-brand-green/15 border border-brand-green/40 text-brand-green flex items-center justify-center font-mono font-black text-xs shadow-[0_0_10px_rgba(106,176,29,0.2)]">
          SB
        </span>
        <span class="text-xs sm:text-sm font-mono text-gray-200 hidden xs:inline sm:inline md:hidden">Shashwat</span>
      </a>

      <!-- Desktop Links -->
      <div class="hidden md:flex items-center gap-6 lg:gap-8 text-[13px] font-medium text-gray-400">
        <a href="#home" class="hover:text-white transition-colors">Home</a>
        <a href="#about" class="hover:text-white transition-colors">About</a>
        <a href="#services" class="hover:text-white transition-colors">Services</a>
        <a href="#projects" class="hover:text-white transition-colors">Case Studies</a>
        <a href="#experience" class="hover:text-white transition-colors">Experience</a>
        <a href="#education" class="hover:text-white transition-colors">Certifications</a>
      </div>

      <!-- Actions & Mobile Menu Toggle -->
      <div class="flex items-center gap-2.5 sm:gap-4">
        <div class="flex items-center gap-2 text-gray-400">
          <a href="https://linkedin.com/in/shashwat-singh-bhadoriya" target="_blank" class="p-1.5 hover:text-brand-green transition-colors" title="LinkedIn">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          </a>
          <a href="https://github.com/shashwat0704" target="_blank" class="p-1.5 hover:text-brand-green transition-colors" title="GitHub">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          </a>
        </div>

        <!-- Light / Dark Mode Toggle Button -->
        <button 
          (click)="toggleTheme()"
          type="button"
          class="p-2 rounded-xl bg-white/5 border border-white/10 hover:border-brand-green/40 hover:bg-brand-green/10 text-gray-300 hover:text-brand-green transition-all flex items-center justify-center group focus:outline-none focus:ring-1 focus:ring-brand-green/50"
          [attr.aria-label]="themeService.currentTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          [title]="themeService.currentTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
          <!-- Sun icon (shown in dark mode) -->
          <svg *ngIf="themeService.currentTheme() === 'dark'" class="w-4 h-4 text-amber-300 group-hover:rotate-45 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14l-1.41 1.41"></path>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg *ngIf="themeService.currentTheme() === 'light'" class="w-4 h-4 text-slate-700 group-hover:-rotate-12 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        
        <a href="#contact" class="hidden sm:inline-block text-xs font-semibold px-3.5 py-1.5 rounded-xl bg-brand-green/10 text-brand-green border border-brand-green/30 hover:bg-brand-green hover:text-black transition-all">
          Get In Touch
        </a>

        <!-- Mobile Menu Hamburger Button -->
        <button (click)="toggleMenu()" class="md:hidden p-1.5 text-gray-400 hover:text-white transition-colors" aria-label="Toggle menu">
          <svg *ngIf="!isMenuOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          <svg *ngIf="isMenuOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Drawer (Clean height, completely hidden when closed) -->
    <div 
      class="md:hidden overflow-hidden transition-all duration-300 ease-in-out"
      [ngClass]="isMenuOpen ? 'max-h-[500px] opacity-100 py-5 border-t border-white/10' : 'max-h-0 opacity-0 py-0 border-t-0 pointer-events-none'">
      <div class="flex flex-col items-center gap-3 text-center px-4">
        <!-- Mobile Theme Switcher Pill -->
        <div class="flex items-center justify-between w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 mb-1">
          <span class="text-xs font-mono uppercase tracking-wider text-gray-400">Theme</span>
          <button 
            (click)="toggleTheme()" 
            type="button"
            class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand-green/10 text-brand-green border border-brand-green/30">
            <span *ngIf="themeService.currentTheme() === 'dark'">☀️ Switch to Light</span>
            <span *ngIf="themeService.currentTheme() === 'light'">🌙 Switch to Dark</span>
          </button>
        </div>

        <a href="#home" (click)="closeMenu()" class="text-sm font-medium text-gray-300 hover:text-white py-1">Home</a>
        <a href="#about" (click)="closeMenu()" class="text-sm font-medium text-gray-300 hover:text-white py-1">About</a>
        <a href="#services" (click)="closeMenu()" class="text-sm font-medium text-gray-300 hover:text-white py-1">Services</a>
        <a href="#tech-skills" (click)="closeMenu()" class="text-sm font-medium text-gray-300 hover:text-white py-1">Stack</a>
        <a href="#abilities" (click)="closeMenu()" class="text-sm font-medium text-gray-300 hover:text-white py-1">Competencies</a>
        <a href="#experience" (click)="closeMenu()" class="text-sm font-medium text-gray-300 hover:text-white py-1">Experience</a>
        <a href="#projects" (click)="closeMenu()" class="text-sm font-medium text-gray-300 hover:text-white py-1">Case Studies</a>
        <a href="#education" (click)="closeMenu()" class="text-sm font-medium text-gray-300 hover:text-white py-1">Education & Certifications</a>
        <a href="#contact" (click)="closeMenu()" class="text-sm font-bold text-brand-green py-2 px-6 rounded-xl bg-brand-green/10 border border-brand-green/20 w-full mt-2">Get In Touch</a>
      </div>
    </div>
  </nav>
</div>

<!-- Invisible hover trigger area when navbar is hidden -->
<div 
  class="fixed top-0 left-0 right-0 h-10 z-[49]" 
  (mouseover)="onMouseOver()">
</div>
