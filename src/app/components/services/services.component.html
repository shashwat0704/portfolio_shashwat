<section id="services" class="py-12 md:py-16 px-4 sm:px-6 md:px-16 lg:px-24 bg-brand-dark">
  <div class="max-w-6xl mx-auto">
    <div class="mb-8 md:mb-12 text-center md:text-left">
      <h2 class="text-3xl sm:text-4xl md:text-[56px] font-bold mb-3 md:mb-6 tracking-tighter">Services</h2>
      <p class="text-[10px] md:text-[12px] font-bold text-gray-500 uppercase tracking-[0.2em]">What I Do</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
      @for (service of services; track service.title) {
        <div class="reveal group p-5 sm:p-6 md:p-8 rounded-3xl bg-brand-nav/20 border border-white/5 hover:border-brand-green/30 transition-all duration-500 glow-border flex flex-col justify-between">
          <div>
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-2xl bg-brand-green/10 flex items-center justify-center text-brand-green mb-4 sm:mb-6 md:mb-8 group-hover:scale-110 transition-transform">
              <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="service.icon"></path>
              </svg>
            </div>
            <h3 class="text-base sm:text-lg md:text-xl font-bold mb-2 md:mb-4 text-white">{{ service.title }}</h3>
          </div>
          <p class="text-xs md:text-[14px] text-gray-400 leading-relaxed">
            {{ service.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
